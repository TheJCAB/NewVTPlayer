  <body>
    <script src="js/main.js" type="application/javascript"></script>

    <button id="start-button">Start audio</button><br>

    <select id="mod-list" size="50" hidden="true"></select><br>

    <script>
      var buttonEl;
      var audioContext;

      const onPlay = async () => {
        buttonEl.disabled = true;

        if (audioContext == undefined)
        {
          audioContext = new AudioContext();
          await startAudio(audioContext);
          buttonEl.textContent = 'Next...';
          audioContext.resume();
        }
        else
        {
          await startNextAudio();
          console.log('Next audio started');
        }

        buttonEl.disabled = false;
        console.log('Audio started');
      };

      // A simple onLoad handler. It also handles user gesture to unlock the audio
      // playback.
      window.addEventListener('load', async () => {
        buttonEl = document.getElementById('start-button');
        buttonEl.disabled = false;
        buttonEl.addEventListener('click', onPlay, false);
      });
