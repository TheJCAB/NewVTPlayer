<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>VTPlayer</title>
    <style>
      body {
        position: fixed;
        left: 0%;
        top: 0%;
        width: 100%;
        height: 100%;
        margin: 0px;
        padding: 0px;
      }
      .app {
        position: absolute;
        left: 0px;
        top: 0px;
        right: 0px;
        bottom: 0px;
        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
        padding: 0px;

        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
        grid-template-rows: 1fr;
      }
      .leftPane {
        grid-column-start: 1;
        grid-column-end: 2;
        grid-row-start: 1;
        grid-row-end: 2;

        display: grid;
        grid-template-rows: 1fr 6fr;

        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
        padding: 0px;
      }
      .mainPane {
        grid-column-start: 2;
        grid-column-end: 6;
        grid-row-start: 1;
        grid-row-end: 2;

        display: grid;
        grid-template-rows: 1fr 5em;

        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
        padding: 0px;
      }
      .menuButton {
        width: 100%;
        height: 100%;
      }
      .menu {
        left: 0px;
        width: 100%;
        height: 100%;
        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
      }
      #modList {
        width: 100%;
        height: 100%;
        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
      }
      .helloText {
        border: 1px solid rgb(0, 0, 0);
      }
      #infoText {
        font-family: "Courier New", Courier, monospace;
      }
      .songPositionDiv {
        text-align: center;
      }
      #songTimeline {
        display: block;
        width: 100%;
      }
      #songTimePosition {
        float: left;
      }
      #songLength {
        float: right;
      }
      .playerButtons {
        text-align: center;
      }
      .playerButton {
        font-size: 1.7em;
        padding: 0px;
        margin: 0px;
        border: none;
        background: none;
        width: 1.5em;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="leftPane">
        <div class="menu">
            <button class="menuButton" id="start-button">Start random song</button><br>
        </div>
        <div>
            <select id="modList" height="100%" size="5"></select>
        </div>
      </div>
      <div class="mainPane">
        <div class="helloText">
          <p id="introText">Hello! This is JCAB writing, and what you see is a new incarnation of my VTPlayer website.</p>
          <pre id="infoText"></pre>
        </div>
        <div id="playerControls">
          <div class="songPositionDiv">
            <span id="songTimePosition"></span>
            <span id="songPositionText"><br></span>
            <span id="songLength"></span>
          </div>
          <progress id="songTimeline" value="0" max="100"></progress>
          <div class="playerButtons">
            <button class="playerButton" id="playerPreviousButton">    &#9198;&#65039; </button>
            <button class="playerButton" id="playerRewindButton">      &#9194;         </button>
            <button class="playerButton" id="playerPlayStopButton">    &#9654;&#65039; </button> <!-- &#9208;&#65039; -->
            <button class="playerButton" id="playerFastForwardButton"> &#9193;         </button>
            <button class="playerButton" id="playerNextButton">        &#9197;&#65039; </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/main.js" type="application/javascript"></script>

    <script>
      initialize()
    </script>
  </body>
</html>
