<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>VTPlayer</title>
    <style>
      body {
        position: fixed;
        left: 0%;
        top: 0%;
        width: 100%;
        height: 100%;
        margin: 0px;
        padding: 0px;
      }
      .app {
        position: absolute;
        left: 0px;
        top: 0px;
        right: 0px;
        bottom: 0px;
        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
        padding: 0px;

        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
        grid-template-rows: 1fr;
      }
      .leftPane {
        grid-column-start: 1;
        grid-column-end: 2;
        grid-row-start: 1;
        grid-row-end: 2;

        display: grid;
        grid-template-rows: 1fr 6fr;

        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
        padding: 0px;
      }
      .mainPane {
        grid-column-start: 2;
        grid-column-end: 6;
        grid-row-start: 1;
        grid-row-end: 2;

        display: grid;
        grid-template-rows: 1fr 3em;

        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
        padding: 0px;
      }
      .menuButton {
        width: 100%;
        height: 100%;
      }
      .menu {
        left: 0px;
        width: 100%;
        height: 100%;
        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
      }
      .modList {
        width: 100%;
        height: 100%;
        border: 1px solid rgb(0, 0, 0);
        margin: 0px;
      }
      .helloText {
        border: 1px solid rgb(0, 0, 0);
      }
      .songPositionDiv {
        text-align: center;
      }
      .songTimeline {
        display: block;
        width: 100%;
      }
      .songTimePosition {
        float: left;
      }
      .songLength {
        float: right;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="leftPane">
        <div class="menu">
            <button class="menuButton" id="start-button">Start random song</button><br>
        </div>
        <div class="modList">
            <select class="modList" id="mod-list" height="100%" size="5"></select>
        </div>
      </div>
      <div class="mainPane">
        <div class="helloText">
          <p>Hello! This is JCAB writing, and what you see is a new incarnation of my VTPlayer website.</p>
        </div>
        <div>
          <div class="songPositionDiv">
            <span class="songTimePosition" id="songTimePosition"></span>
            <span id="songPositionText"><br></span>
            <span class="songLength" id="songLength"></span>
          </div>
          <progress class="songTimeline" id="songTimeline" value="0" max="100"></progress>
        </div>
      </div>
    </div>

    <script src="js/main.js" type="application/javascript"></script>

    <script>
      initialize()
    </script>
  </body>
</html>
