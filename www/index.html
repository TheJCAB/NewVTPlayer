  <body>
    <script src="js/main.js" type="application/javascript"></script>

    <button id="start-button">Start audio</button>

    <script>
      var buttonEl;

      const onClickButton = async () => {
        buttonEl.disabled = true;
        var audioContext = new AudioContext();
        await startAudio(audioContext);
        audioContext.resume();
        buttonEl.textContent = 'Playing...';
        console.log('Audio started');
      };

      // A simple onLoad handler. It also handles user gesture to unlock the audio
      // playback.
      window.addEventListener('load', async () => {
        buttonEl = document.getElementById('start-button');
        buttonEl.disabled = false;
        buttonEl.addEventListener('click', onClickButton, false);
      });
